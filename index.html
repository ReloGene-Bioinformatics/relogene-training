<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ReloGene Training Portal</title>

<style>
:root {
  --primary:#0b4f6c;
  --secondary:#01a7c2;
  --text:#1f2933;
  --white:rgba(255,255,255,0.85);
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

html, body {
  height:100%;
}

body{
  font-family: Arial, sans-serif;
  background:url("assets/background.jpg") center/cover fixed;
  color:var(--text);
  overflow-x:hidden;
}

/* Animated overlay */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(120deg,
    rgba(255,255,255,0.85) 20%,
    rgba(255,255,255,0.6) 50%,
    rgba(255,255,255,0.3) 100%);
  animation: moveBg 12s ease infinite alternate;
  z-index:0;
}

@keyframes moveBg{
  0%{background-position:left;}
  100%{background-position:right;}
}

/* WRAPPER (FIXED) */
.wrapper{
  position:relative;
  z-index:1;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
header{
  text-align:center;
  padding:90px 20px 40px;
  animation:fadeUp 1s ease forwards;
}

header h1{
  font-size:2.8rem;
  color:#0b3d5c;
  text-shadow:0 3px 10px rgba(255,255,255,0.6);
}

header p{
  margin-top:10px;
  color:#2c5c75;
}

/* MAIN CONTENT */
.container{
  display:flex;
  justify-content:center;
  margin-top:40px;
  flex:1; /* pushes footer down */
}

/* CARD */
.card{
  background:var(--white);
  backdrop-filter: blur(12px);
  padding:30px;
  border-radius:18px;
  width:380px;
  box-shadow:0 20px 50px rgba(0,0,0,0.15);
  transition: all 0.3s ease;
  transform-style: preserve-3d;
}

.card:hover{
  transform: rotateY(6deg) rotateX(6deg) scale(1.03);
}

.card h3{
  color:var(--primary);
  margin-bottom:12px;
}

.card p{
  color:#52606d;
  margin-bottom:15px;
}

/* BUTTON */
.card-link{
  display:inline-block;
  padding:10px 18px;
  border-radius:10px;
  background:linear-gradient(45deg,#01a7c2,#0b4f6c);
  color:white;
  text-decoration:none;
  font-weight:bold;
  transition: all 0.3s;
}

.card-link:hover{
  box-shadow:0 0 15px rgba(1,167,194,0.7);
  transform:translateY(-2px);
}

/* ANIMATION */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

/* FOOTER (FIXED) */
footer{
  margin-top:auto;
  padding:20px;
  text-align:center;
  background:rgba(1,167,194,0.2);
  border-top:1px solid rgba(0,0,0,0.05);
  color:#0b3d5c;
  font-weight:600;
}

</style>
</head>

<body>

<div class="wrapper">

<header>
  <h1>ReloGene Training Portal</h1>
  <p>A centralized hub for training presentations, scripts, and workflows.</p>
</header>

<div class="container">
  <div class="card">
    <h3>Bulk RNA-seq Analysis 🧬</h3>
    <p>End-to-end RNA-seq pipeline including QC, alignment,
    differential expression, and enrichment analysis.</p>

    <a href="bulk-rnaseq.html" class="card-link">Open module →</a>
  </div>
</div>

<footer>
© 2026 ReloGene Bioinformatics Pvt. Ltd.
</footer>

</div>

</body>
</html>
